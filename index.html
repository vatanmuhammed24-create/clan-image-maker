<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clan Portal - Access Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background subtle grid effect -->
  <div class="bg-pattern"></div>

  <div class="container">
    <!-- VIEW 1: Password Login Screen -->
    <div id="loginScreen" class="portal-card active">
      <div class="card-badge">CLAN GATEWAY</div>
      
      <div class="card-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="card-title">AUTHENTICATION</h1>
      <p class="card-subtitle">Enter password to access clan headquarters</p>

      <form id="loginForm" autocomplete="off">
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            class="password-field" 
            placeholder="Enter password..." 
            autofocus 
            required
          >
          <button type="button" id="togglePasswordBtn" class="toggle-eye" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div id="errorMessage" class="error-msg"></div>

        <button type="submit" id="submitBtn" class="btn-yellow">
          <span>ENTER</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <!-- VIEW 2: Access Granted Screen -->
    <div id="grantedScreen" class="portal-card">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>SESSION ACTIVE</span>
      </div>

      <div class="granted-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <h1 class="granted-title">ACCESS GRANTED</h1>
      <p class="granted-subtitle">Welcome back, Commander. You have unlocked clan access.</p>

      <div class="granted-content-box">
        <div class="info-row">
          <span class="info-label">Security Clearance</span>
          <span class="info-val yellow-text">LEVEL 1 - AUTHORIZED</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="info-val">Ready for Clan Image Studio</span>
        </div>
      </div>

      <div class="action-buttons">
        <button id="lockBtn" class="btn-secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Lock Portal
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
