<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClanForge - Ultimate Clan Image & Banner Generator</title>
  <meta name="description" content="Design custom clan banners, player cards, Discord avatars, and esports graphics in seconds.">
  
  <!-- Gaming & Tech Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Teko:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">CLAN<span>FORGE</span></h1>
          <p class="brand-subtitle">Image & Banner Studio</p>
        </div>
      </div>

      <div class="navbar-actions">
        <button id="copyBtn" class="btn btn-secondary" title="Copy to clipboard for Discord">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy to Clipboard
        </button>
        <button id="downloadJpgBtn" class="btn btn-secondary">
          Download JPG
        </button>
        <button id="downloadPngBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download PNG
        </button>
      </div>
    </header>

    <div class="main-workspace">
      <!-- Left Sidebar / Controls -->
      <aside class="sidebar">
        <!-- Navigation Tabs -->
        <div class="nav-tabs" role="tablist">
          <button class="tab-btn active" data-tab="tab-presets">Presets</button>
          <button class="tab-btn" data-tab="tab-text">Text & Clan</button>
          <button class="tab-btn" data-tab="tab-bg">Background</button>
          <button class="tab-btn" data-tab="tab-logo">Logo & Icons</button>
          <button class="tab-btn" data-tab="tab-style">Border & FX</button>
        </div>

        <div class="tab-content-container">
          <!-- TAB 1: Presets & Dimensions -->
          <div class="tab-panel active" id="tab-presets">
            <h3 class="section-title">Format Presets</h3>
            <div class="preset-grid">
              <button class="preset-card active" data-preset="discord-avatar" data-w="600" data-h="600">
                <span class="preset-name">Discord Avatar</span>
                <span class="preset-dims">600 × 600 (1:1)</span>
              </button>
              <button class="preset-card" data-preset="discord-banner" data-w="960" data-h="540">
                <span class="preset-name">Clan Banner</span>
                <span class="preset-dims">960 × 540 (16:9)</span>
              </button>
              <button class="preset-card" data-preset="member-card" data-w="800" data-h="1100">
                <span class="preset-name">Player Roster Card</span>
                <span class="preset-dims">800 × 1100 (Portrait)</span>
              </button>
              <button class="preset-card" data-preset="twitter-header" data-w="1200" data-h="400">
                <span class="preset-name">Twitter/X Header</span>
                <span class="preset-dims">1200 × 400 (3:1)</span>
              </button>
              <button class="preset-card" data-preset="stream-overlay" data-w="1920" data-h="1080">
                <span class="preset-name">Full HD Wallpaper</span>
                <span class="preset-dims">1920 × 1080 (16:9)</span>
              </button>
            </div>

            <h3 class="section-title" style="margin-top: 1.5rem;">Quick Theme Styles</h3>
            <div class="theme-chips">
              <button class="theme-chip" data-theme="neon-cyan">⚡ Neon Cyan</button>
              <button class="theme-chip" data-theme="blood-red">🩸 Crimson Elite</button>
              <button class="theme-chip" data-theme="cyber-gold">👑 Royal Gold</button>
              <button class="theme-chip" data-theme="stealth-purple">🔮 Void Purple</button>
              <button class="theme-chip" data-theme="emerald-tac">🎯 Tactical Acid</button>
            </div>
          </div>

          <!-- TAB 2: Text & Clan Details -->
          <div class="tab-panel" id="tab-text">
            <div class="form-group">
              <label for="clanTagInput">Clan Tag</label>
              <input type="text" id="clanTagInput" class="form-control" value="[VALOR]" placeholder="e.g. [ELITE]">
            </div>

            <div class="form-group">
              <label for="clanNameInput">Clan / Team Name</label>
              <input type="text" id="clanNameInput" class="form-control" value="SHADOW VANGUARD" placeholder="Clan Name">
            </div>

            <div class="form-group">
              <label for="playerNameInput">Player / Member Name</label>
              <input type="text" id="playerNameInput" class="form-control" value="PHANTOM" placeholder="Optional Member Name">
            </div>

            <div class="form-group">
              <label for="playerRoleInput">Member Rank / Role</label>
              <input type="text" id="playerRoleInput" class="form-control" value="CLAN LEADER" placeholder="e.g. SNIPER / IGL / VETERAN">
            </div>

            <div class="form-group">
              <label for="taglineInput">Motto / Subtitle</label>
              <input type="text" id="taglineInput" class="form-control" value="STRIKE FROM THE SHADOWS" placeholder="Clan Motto">
            </div>

            <div class="form-group">
              <label for="fontSelect">Typography Style</label>
              <select id="fontSelect" class="form-control">
                <option value="Orbitron">Orbitron (Futuristic & Sci-Fi)</option>
                <option value="Rajdhani" selected>Rajdhani (Esports / Tactical)</option>
                <option value="Teko">Teko (Heavy Military Condensed)</option>
                <option value="Inter">Inter (Clean & Modern)</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group flex-1">
                <label for="primaryColor">Primary Glow Color</label>
                <input type="color" id="primaryColor" value="#00f3ff" class="color-picker">
              </div>
              <div class="form-group flex-1">
                <label for="secondaryColor">Accent Color</label>
                <input type="color" id="secondaryColor" value="#7000ff" class="color-picker">
              </div>
            </div>

            <div class="form-group">
              <label for="glowIntensity">Neon Glow Intensity</label>
              <input type="range" id="glowIntensity" min="0" max="40" value="18" class="range-slider">
            </div>
          </div>

          <!-- TAB 3: Background Settings -->
          <div class="tab-panel" id="tab-bg">
            <div class="form-group">
              <label>Custom Wallpaper / Image</label>
              <label class="file-dropzone" for="bgImageUpload">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>Upload Screenshot or Art</span>
                <span class="file-hint">PNG, JPG, WEBP</span>
                <input type="file" id="bgImageUpload" accept="image/*" style="display: none;">
              </label>
              <button id="removeBgImageBtn" class="btn btn-text" style="display: none; margin-top: 6px;">Remove Uploaded Image</button>
            </div>

            <div class="form-group">
              <label for="bgDarkness">Darkness / Vignette Overlay</label>
              <input type="range" id="bgDarkness" min="0" max="100" value="65" class="range-slider">
            </div>

            <div class="form-group">
              <label>Background Pattern</label>
              <div class="button-toggle-group">
                <button class="toggle-btn active" data-pattern="hex">Hex Grid</button>
                <button class="toggle-btn" data-pattern="grid">Tech Grid</button>
                <button class="toggle-btn" data-pattern="dots">Dots</button>
                <button class="toggle-btn" data-pattern="none">Plain</button>
              </div>
            </div>

            <div class="form-group">
              <label for="patternOpacity">Pattern Opacity</label>
              <input type="range" id="patternOpacity" min="0" max="60" value="20" class="range-slider">
            </div>
          </div>

          <!-- TAB 4: Logo & Insignias -->
          <div class="tab-panel" id="tab-logo">
            <div class="form-group">
              <label>Upload Custom Clan Logo (PNG transparent recommended)</label>
              <label class="file-dropzone" for="clanLogoUpload">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                  <path d="M2 17l10 5 10-5"></path>
                  <path d="M2 12l10 5 10-5"></path>
                </svg>
                <span>Upload Clan Logo</span>
                <span class="file-hint">Transparent PNG for best look</span>
                <input type="file" id="clanLogoUpload" accept="image/*" style="display: none;">
              </label>
              <button id="removeLogoBtn" class="btn btn-text" style="display: none; margin-top: 6px;">Remove Custom Logo</button>
            </div>

            <h3 class="section-title" style="margin-top: 1.5rem;">Or Choose Default Clan Emblem</h3>
            <div class="emblem-grid">
              <button class="emblem-btn active" data-emblem="shield">🛡️ Shield</button>
              <button class="emblem-btn" data-emblem="swords">⚔️ Swords</button>
              <button class="emblem-btn" data-emblem="skull">💀 Skull</button>
              <button class="emblem-btn" data-emblem="crown">👑 Crown</button>
              <button class="emblem-btn" data-emblem="crosshair">🎯 Crosshair</button>
              <button class="emblem-btn" data-emblem="none">None</button>
            </div>

            <div class="form-group" style="margin-top: 1.2rem;">
              <label for="logoSize">Logo / Emblem Size</label>
              <input type="range" id="logoSize" min="40" max="300" value="130" class="range-slider">
            </div>

            <div class="form-group">
              <label for="logoYOffset">Emblem Vertical Position</label>
              <input type="range" id="logoYOffset" min="-150" max="150" value="0" class="range-slider">
            </div>
          </div>

          <!-- TAB 5: Frames & Effects -->
          <div class="tab-panel" id="tab-style">
            <div class="form-group">
              <label>Border / Frame Style</label>
              <div class="button-toggle-group">
                <button class="toggle-btn active" data-frame="corners">Cyber Brackets</button>
                <button class="toggle-btn" data-frame="glow-border">Neon Outline</button>
                <button class="toggle-btn" data-frame="double">Double Military</button>
                <button class="toggle-btn" data-frame="none">No Border</button>
              </div>
            </div>

            <div class="form-group">
              <label for="borderWidth">Border Width</label>
              <input type="range" id="borderWidth" min="1" max="15" value="3" class="range-slider">
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="scanlinesToggle" checked>
                <span>Cyberpunk Scanlines Effect</span>
              </label>
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="noiseToggle" checked>
                <span>Subtle Film Grain Texture</span>
              </label>
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="watermarkToggle" checked>
                <span>Clan Verified Stamp</span>
              </label>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Live Canvas Viewport -->
      <main class="canvas-viewport">
        <div class="viewport-toolbar">
          <div class="canvas-info">
            <span id="canvasDimLabel">600 × 600 px</span>
            <span class="badge-live">LIVE RENDER</span>
          </div>

          <div class="zoom-controls">
            <button id="zoomOutBtn" class="tool-btn" title="Zoom Out">−</button>
            <span id="zoomLevelText">100%</span>
            <button id="zoomInBtn" class="tool-btn" title="Zoom In">+</button>
            <button id="zoomFitBtn" class="tool-btn" title="Fit to Screen">Fit</button>
          </div>
        </div>

        <div class="canvas-stage" id="canvasStage">
          <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="clanCanvas" width="600" height="600"></canvas>
          </div>
        </div>

        <div class="canvas-tips">
          <span>💡 Tip: Everything renders in real-time. Use <b>Copy to Clipboard</b> to paste straight into Discord chat!</span>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script src="app.js"></script>
</body>
</html>
