<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clan Portal - Access Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background dot pattern -->
  <div class="bg-pattern"></div>

  <div class="container">
    <!-- VIEW 1: Password Gate (Initial State) -->
    <div id="loginScreen" class="portal-card active">
      <div class="card-badge">CLAN GATEWAY</div>
      
      <div class="card-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="card-title">AUTHENTICATION</h1>
      <p class="card-subtitle">Enter password to access clan headquarters</p>

      <form id="loginForm" autocomplete="off">
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            class="password-field" 
            placeholder="Enter password..." 
            autofocus 
            required
            maxlength="100"
          >
          <button type="button" id="togglePasswordBtn" class="toggle-eye" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div id="errorMessage" class="error-msg"></div>

        <button type="submit" id="submitBtn" class="btn-yellow">
          <span>ENTER</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <!-- VIEW 2: Server-Delivered Protected Container (Populated ONLY after server verification) -->
    <div id="grantedScreen" class="portal-card">
      <!-- Content is dynamically rendered from server response only -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
